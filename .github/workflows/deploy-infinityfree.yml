name: Deploy para a InfinityFree

# Corre a cada push para "main" (produção) ou manualmente em Actions > Run workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, gd, mbstring
          coverage: none

      - name: Instalar dependências (só produção)
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      # A InfinityFree só dá acesso à pasta "htdocs/" (sem subir um nível),
      # por isso "achatamos" aqui o conteúdo de public/ para a raiz e
      # colocamos app/, vendor/ e database/ ao lado — ver README > Deploy em
      # produção. public/index.php e app/core/config.php já detectam este
      # layout automaticamente.
      - name: Preparar layout de produção (achatado)
        run: |
          set -e
          rm -rf dist
          mkdir -p dist

          cp -r public/. dist/
          cp -r app dist/app
          cp -r vendor dist/vendor
          cp -r database dist/database
          cp -r storage dist/storage

      - name: Publicar via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./htdocs/
          # Nunca gerido pelo deploy: .env (segredos, só no servidor),
          # imagens enviadas pelo admin e logs em tempo de execução.
          exclude: |
            **/.git*
            **/.git*/**
            .env
            uploads/**
            storage/logs/**
